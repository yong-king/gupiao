<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>股票监控操作台</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --panel: #101b2d;
        --panel-2: #15243a;
        --text: #eef5ff;
        --muted: #93a4ba;
        --line: rgba(180, 202, 230, 0.16);
        --accent: #4cc9a6;
        --accent-2: #66a6ff;
        --danger: #ff6b7a;
        --warning: #ffd166;
        --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #edf3f8;
        --panel: #ffffff;
        --panel-2: #f6f9fc;
        --text: #142033;
        --muted: #64748b;
        --line: #d7e2ee;
        --accent: #0f7a68;
        --accent-2: #2563eb;
        --danger: #c6283f;
        --warning: #a16207;
        --shadow: 0 16px 40px rgba(23, 37, 54, 0.1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      #app {
        min-height: 100vh;
      }
      #app.app-shell {
        display: grid;
        grid-template-columns: 248px 1fr;
      }
      #app.auth-layout {
        display: grid;
        grid-template-columns: 1fr;
        place-items: center;
        padding: 24px;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        background: #0b1524;
        border-right: 1px solid var(--line);
        padding: 22px 14px;
      }
      :root[data-theme="light"] .sidebar {
        background: #102033;
      }
      .brand {
        display: grid;
        gap: 4px;
        margin: 4px 8px 22px;
      }
      .brand strong {
        font-size: 20px;
        color: #ffffff;
      }
      .brand span {
        color: #9fb4cc;
        font-size: 13px;
      }
      nav {
        display: grid;
        gap: 8px;
      }
      .sidebar button {
        min-height: 42px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: transparent;
        color: #d8e7f8;
        cursor: pointer;
        font-size: 15px;
        text-align: left;
        padding: 9px 12px;
      }
      .sidebar button.active,
      .sidebar button:hover {
        background: rgba(76, 201, 166, 0.14);
        border-color: rgba(76, 201, 166, 0.28);
        color: #ffffff;
      }
      .content {
        padding: 28px;
        min-width: 0;
        background:
          linear-gradient(180deg, rgba(76, 201, 166, 0.08), transparent 260px),
          radial-gradient(circle at top right, rgba(102, 166, 255, 0.16), transparent 360px);
      }
      .topbar,
      .view-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      .topbar {
        margin-bottom: 18px;
      }
      .userbar,
      .actions,
      .pill-row,
      .row-actions,
      .inline-form {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .view-header {
        margin: 18px 0 14px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: color-mix(in srgb, var(--panel) 84%, transparent);
      }
      .safety-badge,
      .risk-badge,
      .pool-pill {
        border-radius: 999px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        padding: 6px 10px;
        white-space: nowrap;
      }
      .safety-badge {
        color: var(--accent);
        border-color: rgba(76, 201, 166, 0.35);
      }
      .pool-pill.active {
        border-color: var(--accent);
        background: rgba(76, 201, 166, 0.16);
      }
      .muted {
        color: var(--muted);
      }
      .status-line {
        color: var(--muted);
        min-height: 24px;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 9px;
        overflow-wrap: anywhere;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 16px;
      }
      .wide {
        grid-column: 1 / -1;
      }
      article {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      h1, h2, h3, p {
        margin-top: 0;
      }
      h1 {
        margin-bottom: 6px;
        font-size: 28px;
      }
      h2 {
        margin-bottom: 8px;
      }
      h3 {
        font-size: 16px;
      }
      label {
        display: grid;
        gap: 7px;
        margin: 12px 0;
        color: var(--muted);
      }
      input, select, button {
        font: inherit;
      }
      input, select, textarea {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 0 10px;
        background: var(--panel-2);
        color: var(--text);
        min-width: 0;
      }
      textarea {
        padding: 10px;
        resize: vertical;
      }
      button {
        min-height: 36px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--text);
        border-radius: 7px;
        padding: 0 11px;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .link-button {
        padding: 0;
        min-height: 0;
        border: 0;
        background: transparent;
        color: var(--accent-2);
      }
      .two-col {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .stock-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
        min-width: 620px;
      }
      article:has(.stock-table) {
        overflow-x: auto;
      }
      .stock-table th,
      .stock-table td {
        border-bottom: 1px solid var(--line);
        padding: 9px;
        text-align: left;
        vertical-align: middle;
      }
      .stock-table th {
        color: var(--muted);
        font-weight: 600;
      }
      .gain {
        color: var(--accent);
      }
      .loss {
        color: var(--danger);
      }
      .cn-up {
        color: #ff4d5e;
        font-weight: 700;
      }
      .cn-down {
        color: #18b981;
        font-weight: 700;
      }
      .research-summary {
        border-left: 3px solid var(--accent);
        padding-left: 10px;
        color: var(--text);
      }
      .assistant-layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        gap: 16px;
      }
      .assistant-config,
      .chat-panel {
        min-height: 520px;
      }
      .chat-panel {
        display: grid;
        grid-template-rows: auto minmax(260px, 1fr) auto auto auto;
      }
      .chat-window {
        display: grid;
        align-content: start;
        gap: 12px;
        overflow: auto;
        min-height: 300px;
        max-height: 52vh;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(8, 17, 31, 0.3);
      }
      .chat-message {
        width: min(760px, 88%);
        display: grid;
        gap: 5px;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-2);
      }
      .chat-message span {
        color: var(--muted);
        font-size: 12px;
      }
      .chat-message p {
        margin: 0;
        line-height: 1.65;
        white-space: pre-wrap;
      }
      .chat-message.user {
        justify-self: end;
        border-color: rgba(102, 166, 255, 0.34);
        background: rgba(102, 166, 255, 0.12);
      }
      .chat-message.assistant {
        justify-self: start;
        border-color: rgba(76, 201, 166, 0.32);
        background: rgba(76, 201, 166, 0.1);
      }
      .empty-chat {
        color: var(--muted);
        align-self: center;
        justify-self: center;
      }
      .chat-composer textarea {
        min-height: 88px;
      }
      .price-chart {
        width: 100%;
        height: 180px;
        display: block;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .chart-grid {
        fill: none;
        stroke: rgba(148, 163, 184, 0.28);
        stroke-width: 1;
      }
      .chart-line {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .chart-point {
        fill: var(--accent);
      }
      .chart-value,
      .market-number {
        color: var(--accent);
        font-weight: 700;
      }
      .change-calendar {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }
      .calendar-cell {
        min-height: 54px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 6px;
        display: grid;
        align-content: space-between;
        background: var(--panel-2);
      }
      .calendar-cell span {
        font-size: 12px;
      }
      .calendar-cell.up {
        background: rgba(76, 201, 166, 0.14);
        color: var(--accent);
      }
      .calendar-cell.down {
        background: rgba(255, 107, 122, 0.14);
        color: var(--danger);
      }
      .alert-list,
      .dependency-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 10px;
      }
      .alert-item {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: var(--panel-2);
      }
      .risk-low {
        color: var(--muted);
      }
      .risk-medium {
        color: var(--warning);
      }
      .risk-high,
      .risk-critical {
        color: var(--danger);
      }
      .risk-card-high,
      .risk-card-critical {
        border-color: rgba(255, 107, 122, 0.45);
        background: rgba(255, 107, 122, 0.1);
      }
      .risk-card-medium {
        border-color: rgba(255, 209, 102, 0.35);
        background: rgba(255, 209, 102, 0.08);
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .dot.ok {
        background: var(--accent);
      }
      .dot.bad {
        background: var(--danger);
      }
      .auth {
        width: min(430px, 100%);
      }
      .auth-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        box-shadow: var(--shadow);
      }
      .inline-check {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      @media (max-width: 780px) {
        #app.app-shell {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: static;
          height: auto;
        }
        nav {
          display: flex;
          overflow-x: auto;
        }
        .sidebar button {
          white-space: nowrap;
        }
        .topbar,
        .view-header {
          display: grid;
        }
        .two-col {
          grid-template-columns: 1fr;
        }
        .assistant-layout {
          grid-template-columns: 1fr;
        }
        .assistant-config,
        .chat-panel {
          min-height: auto;
        }
        .content {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js?v=26"></script>
  </body>
</html>
